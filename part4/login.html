<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB - Login</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="images/icon.png">
</head>
<body>
  <header>
    <a href="index.html"><img class="logo" src="images/logo.png" alt="HBnB logo"></a>
    <nav>
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
      </ul>
    </nav>
    <a class="login-button" href="login.html">Login</a>
  </header>

  <main>
    <h1>Login</h1>

    <form class="form" id="login-form" action="#" method="post">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" placeholder="you@example.com" autocomplete="email" required>

      <label for="password">Password</label>
      <input type="password" id="password" name="password" autocomplete="current-password" required>

      <button type="submit" class="details-button">Login</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 HBnB. All rights reserved.</p>
  </footer>
</body>
</html>
